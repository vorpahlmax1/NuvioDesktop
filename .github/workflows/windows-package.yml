name: Package MultiNutz Windows

# Builds a Windows MSI (and portable zip) Max can download from Actions / Releases.
# This fork-friendly path skips the full desktop-release environment + Sentry upload.

on:
  workflow_dispatch:
  push:
    branches:
      - Dev
      - 'cursor/**'
    tags:
      - 'v*'
      - 'multinutz*'
  pull_request:
    paths:
      - '.github/workflows/windows-package.yml'
      - 'composeApp/build.gradle.kts'
      - 'composeApp/Configuration/DesktopVersion.properties'
      - 'scripts/package-windows.ps1'

permissions:
  contents: write

concurrency:
  group: windows-package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64 MSI
    runs-on: windows-2022
    env:
      WEBVIEW2_VERSION: 1.0.4078.44
      # Optional: set these as repo Actions secrets for cloud features.
      NUVIO_SUPABASE_URL: ${{ secrets.NUVIO_SUPABASE_URL }}
      NUVIO_SUPABASE_ANON_KEY: ${{ secrets.NUVIO_SUPABASE_ANON_KEY }}
      NUVIO_SUPABASE_FALLBACK_URL: ${{ secrets.NUVIO_SUPABASE_FALLBACK_URL }}
      TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
      TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
      MDBLIST_CLIENT_ID: ${{ secrets.MDBLIST_CLIENT_ID }}
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      SENTRY_DESKTOP_DSN: ${{ secrets.SENTRY_DESKTOP_DSN }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Fetch Windows libmpv runtime (LFS)
        shell: bash
        run: |
          git lfs pull --include="composeApp/src/desktopMain/native/windows/runtime/**" --exclude=""
          runtime_path="composeApp/src/desktopMain/native/windows/runtime/libmpv-2.dll"
          if [[ ! -f "${runtime_path}" ]]; then
            echo "The bundled Windows libmpv runtime is missing." >&2
            exit 1
          fi
          runtime_size="$(wc -c < "${runtime_path}")"
          if (( runtime_size < 1000000 )); then
            echo "The bundled Windows libmpv runtime was not materialized from Git LFS." >&2
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Write local.properties from optional secrets
        shell: bash
        run: |
          {
            echo "# Generated by windows-package.yml — empty values are OK for a local/BYO MultiNutz build."
            for key in \
              NUVIO_SUPABASE_URL \
              NUVIO_SUPABASE_ANON_KEY \
              NUVIO_SUPABASE_FALLBACK_URL \
              TRAKT_CLIENT_ID \
              TRAKT_CLIENT_SECRET \
              MDBLIST_CLIENT_ID \
              TMDB_API_KEY \
              SENTRY_DESKTOP_DSN \
              SENTRY_DSN
            do
              value="${!key:-}"
              if [[ -n "${value}" ]]; then
                printf '%s=%s\n' "${key}" "${value}"
              fi
            done
          } > local.properties

      - name: Read desktop version
        id: version
        shell: bash
        run: |
          version="$(
            awk -F= '/^VERSION_NAME=/ { print $2; exit }' \
              composeApp/Configuration/DesktopVersion.properties
          )"
          if [[ -z "${version}" ]]; then
            echo "VERSION_NAME missing from DesktopVersion.properties" >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "Desktop version: ${version}"

      - name: Install WebView2 SDK
        shell: pwsh
        run: |
          nuget install Microsoft.Web.WebView2 `
            -Version $env:WEBVIEW2_VERSION `
            -OutputDirectory "$env:RUNNER_TEMP\nuget" `
            -DirectDownload `
            -NonInteractive `
            -NoCache

          $webView2Root = Join-Path $env:RUNNER_TEMP "nuget\Microsoft.Web.WebView2.$env:WEBVIEW2_VERSION"
          $loaderLibrary = Join-Path $webView2Root "build\native\x64\WebView2Loader.dll.lib"
          if (-not (Test-Path $loaderLibrary)) {
            throw "WebView2Loader.dll.lib was not found at $loaderLibrary"
          }
          "WEBVIEW2_ROOT=$webView2Root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Ensure WiX Toolset on PATH (jpackage MSI)
        shell: pwsh
        run: |
          # windows-2022 images already ship WiX 3.14; only install if light.exe is missing.
          $wixBin = @(
            "${env:ProgramFiles(x86)}\WiX Toolset v3.14\bin",
            "${env:ProgramFiles(x86)}\WiX Toolset v3.11\bin",
            "${env:ProgramFiles}\WiX Toolset v3.14\bin"
          ) | Where-Object { Test-Path (Join-Path $_ "light.exe") } | Select-Object -First 1

          if (-not $wixBin) {
            choco install wixtoolset --yes --no-progress
            $wixBin = @(
              "${env:ProgramFiles(x86)}\WiX Toolset v3.14\bin",
              "${env:ProgramFiles(x86)}\WiX Toolset v3.11\bin"
            ) | Where-Object { Test-Path (Join-Path $_ "light.exe") } | Select-Object -First 1
          }

          if (-not $wixBin) {
            throw "WiX light.exe not found after ensure step."
          }

          Write-Host "Using WiX at $wixBin"
          "PATH=$wixBin;$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Package Windows MSI + portable zip
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          & .\scripts\package-windows.ps1 `
            -WebView2Root $env:WEBVIEW2_ROOT `
            -Version $env:RELEASE_VERSION

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: multinutz-windows-x64-${{ steps.version.outputs.version }}
          path: |
            composeApp/build/compose/release-msis/MultiNutz-Windows-x64-${{ steps.version.outputs.version }}.msi
            composeApp/build/compose/release-zips/MultiNutz-Windows-x64-${{ steps.version.outputs.version }}.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: Attach to GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Read desktop version
        id: version
        run: |
          version="$(
            awk -F= '/^VERSION_NAME=/ { print $2; exit }' \
              composeApp/Configuration/DesktopVersion.properties
          )"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Download Windows artifacts
        uses: actions/download-artifact@v7
        with:
          name: multinutz-windows-x64-${{ steps.version.outputs.version }}
          path: release-assets

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          shopt -s nullglob
          assets=(release-assets/*)
          if (( ${#assets[@]} == 0 )); then
            echo "No release assets downloaded." >&2
            exit 1
          fi

          notes="$(printf '%s\n' \
            "MultiNutz Desktop Windows build \`${VERSION}\`." \
            "" \
            "- Install: run the \`.msi\`" \
            "- Portable: unzip the \`.zip\` and launch \`MultiNutz.exe\`" \
            "" \
            "Built from tag \`${TAG}\`." \
          )"

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${assets[@]}" --clobber
          else
            gh release create "${TAG}" "${assets[@]}" \
              --title "MultiNutz ${VERSION}" \
              --notes "${notes}"
          fi
